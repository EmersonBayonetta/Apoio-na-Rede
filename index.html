<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='4' r='2'/><path d='m8 10 3 3 5-5'/><path d='M10 20v-5'/><path d='M14 20v-5'/></svg>" />
    <title>AcessaCidade — Catálogo e Mapa de Acessibilidade Urbana</title>
    <meta name="description" content="Plataforma de mapeamento e catálogo de acessibilidade urbana para pessoas com deficiência física, visual, auditiva, intelectual e invisível." />
    
    <!-- Google Fonts: Inter e Lexend (otimizada para leitura e dislexia) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-200 selection:text-blue-900 transition-colors duration-150">
    <div id="root"></div>

    <!-- Widget VLibras Oficial (Governo Federal) -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      try {
        new window.VLibras.Widget('https://vlibras.gov.br/app');
      } catch (e) {
        console.warn('VLibras não inicializado no ambiente local:', e);
      }
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
